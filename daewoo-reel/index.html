<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daewoo · ۸ پیمان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&display=block" rel="stylesheet">
<style>
  :root{
    --red:#ED1C24; --black:#0B0B0C; --white:#FFFFFF;
    --lift:#161618; --deep:#B5121A;
    --w60:rgba(255,255,255,.6); --w30:rgba(255,255,255,.3);
  }
  html,body{margin:0;height:100%;background:var(--black);overflow:hidden}
  body{font-family:"Vazirmatn",sans-serif;color:var(--white);-webkit-font-smoothing:antialiased}
  #viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:1080px;height:1920px;flex:none;overflow:hidden;background:var(--black);transform-origin:50% 50%}
  .layer{position:absolute;inset:0;pointer-events:none}
  svg.full{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:visible}
  svg{shape-rendering:geometricPrecision}

  /* depth & atmosphere */
  #bgLift{background:radial-gradient(900px 900px at 46% 36%, var(--lift) 0%, rgba(22,22,24,0) 70%)}
  #vignette{background:radial-gradient(ellipse 78% 62% at 46% 46%, rgba(0,0,0,0) 52%, rgba(0,0,0,.55) 100%)}
  #grain{background-repeat:repeat;background-size:512px 512px;mix-blend-mode:overlay;opacity:.2;image-rendering:pixelated}

  /* typography */
  .txt{position:absolute;left:180px;width:720px;display:flex;align-items:center;justify-content:center;text-align:center;direction:rtl}
  .txt .line{display:inline-block;white-space:nowrap}
  .txt.wrap .line{white-space:normal;max-width:700px;line-height:1.45}
  .w{display:inline-block;padding:.16em .05em;will-change:clip-path,transform,filter}
  .w.r{color:var(--red)}
  .ord{font-weight:500;font-size:36px;color:var(--w60)}
  .rule{display:inline-block;width:54px;height:2px;background:var(--w30);vertical-align:middle;margin:0 22px;transform-origin:50% 50%}
  .title{font-weight:800;font-size:72px;line-height:1.2}
  .detail{font-weight:300;font-size:46px}
  .q1{font-weight:300;font-size:58px;color:var(--w60)}
  .q2{font-weight:800;font-size:80px}
  .values{font-weight:500;font-size:46px}
  .values .sep{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--w30);vertical-align:middle;margin:0 26px}
  .hero{position:absolute;left:180px;width:720px;display:flex;align-items:baseline;justify-content:center;gap:26px;direction:rtl}
  .hero .num{font-weight:800;font-size:260px;line-height:1.08;color:var(--red);white-space:nowrap}
  .hero .unit{font-weight:500;font-size:60px;color:var(--w60)}
  .sub{font-weight:300;font-size:34px;color:var(--w60)}

  /* line art */
  .art{position:absolute;overflow:visible}
  .art *, #finaleSvg *{vector-effect:none}
  .ln{fill:none;stroke:var(--white);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  .ln.a{stroke:var(--w30)}
  .ln.b{stroke-width:3.4}
  .ln.h{stroke-width:4.4}

  /* preview UI (never rendered in ?render=1) */
  #ui{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:12px;align-items:center;
      background:rgba(22,22,24,.92);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 14px;
      font:13px/1 ui-monospace,Menlo,monospace;color:#fff;direction:ltr;z-index:10;user-select:none}
  #ui button{background:#ED1C24;border:0;color:#fff;border-radius:8px;width:38px;height:30px;font-size:14px;cursor:pointer}
  #ui input{width:min(52vw,520px);accent-color:#ED1C24}
  #ui .hint{opacity:.55}
  #safe{display:none;outline:2px dashed rgba(237,28,36,.8);position:absolute;left:90px;top:260px;width:810px;height:1280px;pointer-events:none;z-index:9}
  body.hideui #ui{display:none}
  body.showsafe #safe{display:block}
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div class="layer" id="bgLift"></div>
    <svg class="full layer" id="depthSvg" viewBox="0 0 1080 1920" style="opacity:.55"><g id="depth"></g></svg>
    <svg class="full layer" id="introSvg" viewBox="0 0 1080 1920"></svg>
    <div class="layer" id="promises"></div>
    <svg class="full layer" id="finaleSvg" viewBox="0 0 1080 1920"></svg>
    <svg class="full layer" id="eightSvg" viewBox="0 0 1080 1920"><g id="eight"></g></svg>
    <div class="layer" id="texts"></div>
    <svg class="full layer" id="logoSvg" viewBox="0 0 1080 1920">
      <!-- PLACEHOLDER: replace the contents of #logo with the official Daewoo SVG logo -->
      <g id="logo"><text x="540" y="1372" text-anchor="middle" fill="#FFFFFF"
        style="font-family:Vazirmatn,sans-serif;font-weight:800;font-size:62px;letter-spacing:14px;direction:ltr">DAEWOO</text></g>
    </svg>
    <div class="layer" id="vignette"></div>
    <div class="layer" id="grain"></div>
    <div id="safe"></div>
  </div>
</div>
<div id="ui">
  <button id="play" title="Play / pause (Space)">▶</button>
  <input id="scrub" type="range" min="0" step="0.001" value="0">
  <span id="clock">0.00s · f0</span>
  <span class="hint">Space · ←/→ frame · S safe zone · H hide</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* =====================================================================
   CONFIG — all on-screen text, timings and colors live here.
   ===================================================================== */
const CONFIG = {
  fps: 30,
  duration: 45.0,
  seed: 8008,
  colors: {
    red: '#ED1C24', black: '#0B0B0C', white: '#FFFFFF',
    lift: '#161618', deep: '#B5121A',
    w60: 'rgba(255,255,255,.6)', w30: 'rgba(255,255,255,.3)'
  },
  // Stage layout (px, 1080×1920). Content is centered on the screen (cx 540) and kept inside x 180–900, clear of the Reel buttons on the right.
  layout: { cx: 540, textW: 720, ordY: 418, artY: 680, heroY: 1040, titleY: 1236, detailY: 1352, heroMaxW: 700 },

  // The 8: a figure-eight drawn as one continuous stroke, cut into 8 equal segments (one per promise).
  // In the finale it gathers, rotates 90° and becomes ∞.
  eight: {
    H: 150, width: 190, topK: 0.84, stroke: 30, gap: 1.4, phase: 6.25, explode: 30,
    outline: '#545455',                       // = white 30% over black, opaque (no double alpha at the crossing)
    intro:    { x: 540, y: 760, s: 2.0  },
    progress: { x: 540, y: 318, s: 0.30 },
    final:    { x: 540, y: 520, s: 1.9, rot: 90, k: 1, width: 165, stroke: 18 }
  },

  intro: {
    q1: 'بعد از خرید،',
    q2: 'چه کسی کنار شماست؟',
    title: 'پیمان ما با مشتریان',
    values: ['تعهد', 'احترام', 'آرامش'],
    y: { q1: 1236, q2: 1336, title: 1250, values: 1366 }
  },

  // Master timing (seconds). 120 BPM grid: beat 0.5s, bar 2s; each promise = 2 bars.
  bpm: 120,
  t: {
    draw: 0.0, drawDur: 0.75,
    q1: 0.4, q2: 0.6, qOut: 2.75,
    title: 2.9, values: 3.3, introOut: 5.3,
    fly: 5.3, flyDur: 0.7,
    promiseStart: 6.0, promiseDur: 4.0,
    finale: 38.0
  },
  // Per-promise local timing (seconds from the promise start). The segment completes on beat 3 (1.0s).
  p: { ord: 0.0, art: 0.0, hero: 0.1, count: 0.75, fill: 0.55, fillDur: 0.45, title: 0.3, detail: 0.55, out: 3.55 },
  motion: { art: 1.55 },                       // line-art animations play this much faster

  // ⚠ Placeholder copy — replace with the official list of commitments.
  promises: [
    { ord: 'پیمان اول',   art: 'dial',    hero: { count: 24,  unit: 'ساعته' },
      title: 'پاسخگویی شبانه‌روزی',        detail: 'هر روز هفته، حتی روزهای تعطیل' },
    { ord: 'پیمان دوم',   art: 'route',   hero: { count: 48,  unit: 'ساعت' },
      title: 'حضور کارشناس در منزل شما',  detail: 'از ثبت درخواست تا زنگ در خانه‌ی شما' },
    { ord: 'پیمان سوم',   art: 'gear',    hero: { count: 100, suffix: '٪' },
      title: 'قطعات اصلی و اورجینال',     detail: 'با ضمانت اصالت و کیفیت هر قطعه' },
    { ord: 'پیمان چهارم', art: 'shield',  hero: { word: 'رایگان' },
      title: 'تعمیر در دوره‌ی گارانتی',     detail: 'بی‌هیچ هزینه‌ای برای قطعه و اجرت' },
    { ord: 'پیمان پنجم',  art: 'ring',    hero: { count: 6,   unit: 'ماه' },
      title: 'ضمانت کیفیت هر تعمیر',      detail: 'هر تعمیر، با ضمانتی تازه' },
    { ord: 'پیمان ششم',   art: 'door',    hero: { word: 'احترام' },
      title: 'کارشناس آموزش‌دیده و آراسته', detail: 'با رعایت کامل حریم خانه‌ی شما' },
    { ord: 'پیمان هفتم',  art: 'receipt', hero: { word: 'شفاف' },
      title: 'تعرفه‌ی رسمی و روشن',         detail: 'پیش از هر کار، هزینه را می‌دانید' },
    { ord: 'پیمان هشتم',  art: 'bubbles', hero: { word: 'رضایت' },
      title: 'پیگیری تا رضایت کامل',       detail: 'پس از هر خدمت، تماس می‌گیریم' }
  ],

  finale: {
    title: 'پیمانی بی‌پایان',
    values: ['تعهد', 'احترام', 'آرامش'],
    group: 'گروه صنعتی انتخاب',
    y: { title: 1150, values: 1246, group: 1432 },
    // local timing from CONFIG.t.finale (beats: lock on 1.0, ∞ lands on 2.0)
    t: { explode: 0.0, fly: 0.1, flyDur: 0.9, rot: 1.0, rotDur: 1.0, items: 2.0, title: 2.35, values: 2.85, logo: 3.4 }
  },

  grain: { fps: 15, tile: 256 }
};

/* =====================================================================
   Utilities (deterministic)
   ===================================================================== */
const SVGNS = 'http://www.w3.org/2000/svg';
const FA = '۰۱۲۳۴۵۶۷۸۹';
const fa = n => String(n).replace(/\d/g, d => FA[d]);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
function el(tag, attrs = {}, parent){const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function div(cls, parent, style = {}){const d=document.createElement('div');d.className=cls;Object.assign(d.style,style);if(parent)parent.appendChild(d);return d}
const P = (r, deg) => { const a = deg * Math.PI / 180; return [+(r*Math.cos(a)).toFixed(2), +(r*Math.sin(a)).toFixed(2)]; };

/* Word-level text (never per letter: keeps Persian joining intact). */
function makeText(parent, text, { y, cls = '', h = 140, wrap = false }){
  const box = div('txt ' + cls + (wrap ? ' wrap' : ''), parent, { top: (y - h/2) + 'px', height: h + 'px' });
  const line = document.createElement('span'); line.className = 'line'; box.appendChild(line);
  const words = [];
  text.split(' ').forEach((tok, i, arr) => {
    const red = tok.includes('*');
    const s = document.createElement('span'); s.className = 'w' + (red ? ' r' : '');
    s.textContent = tok.replace(/\*/g, '');
    line.appendChild(s); words.push(s);
    if (i < arr.length - 1) line.appendChild(document.createTextNode(' '));
  });
  return { box, line, words };
}

/* Motion grammar: things enter from the right and leave toward the left. */
const HIDE_R = 'inset(0% 0% 0% 100%)', SHOW = 'inset(0% 0% 0% 0%)', HIDE_L = 'inset(0% 100% 0% 0%)';
function wordsIn(tl, words, at, { stagger = 0.06, dur = 0.55 } = {}){
  tl.fromTo(words, { clipPath: HIDE_R, x: 26, filter: 'blur(8px)', opacity: 0 },
    { clipPath: SHOW, x: 0, filter: 'blur(0px)', opacity: 1, duration: dur, stagger, ease: 'power3.out', immediateRender: true }, at);
}
function wordsOut(tl, words, at, { stagger = 0.035, dur = 0.35 } = {}){
  tl.fromTo(words, { clipPath: SHOW, x: 0, filter: 'blur(0px)', opacity: 1 },
    { clipPath: HIDE_L, x: -22, filter: 'blur(6px)', opacity: 0, duration: dur, stagger, ease: 'power2.in', immediateRender: false }, at);
}
function drawIn(tl, nodes, at, { dur = 1.0, stagger = 0.06, ease = 'power2.inOut' } = {}){
  nodes = [].concat(nodes);
  if (!nodes.length) return;
  tl.fromTo(nodes, { strokeDashoffset: 1.002, opacity: 0 },
    { strokeDashoffset: 0, opacity: 1, duration: dur, stagger, ease, immediateRender: true }, at);
}
function prepDraw(root){ $$('.d', root).forEach(n => { n.setAttribute('pathLength', '1'); n.style.strokeDasharray = '1 2'; n.style.strokeDashoffset = '1.002'; }); }

/* Derived renderers: anything driven by proxies (counters, morphs, motion paths, grain).
   Run after every seek, so frames are reproducible with tl.seek(). */
const DERIVED = [];
function renderDerived(){ for (const f of DERIVED) f(); }

/* =====================================================================
   The 8  (→ ∞)
   ===================================================================== */
const E = CONFIG.eight;
const eightP = { x: E.intro.x, y: E.intro.y, s: E.intro.s, rot: 0, k: E.topK, w: E.width, sw: E.stroke, ex: 0, pulse: 1 };
// Typographic figure-eight: two round lobes (cubic Béziers) crossing at the center at 45°.
// Drawn as one stroke from the top, heading left (like handwriting); w = width, H = height of the bottom lobe ×2, k = top-lobe scale.
function eightPath(w, H, k){
  const f = v => v.toFixed(2), K = 0.5523, a = Math.PI / 4;
  const lobe = (rx, ry, sgn) => ({ rx, ry, sgn });          // sgn -1 = top lobe, +1 = bottom lobe
  const T = lobe(w/2*k, H/2*k, -1), B = lobe(w/2, H/2, 1);
  const off = (B.ry - T.ry);                                 // vertical centering
  const P = (x, y) => `${f(x)} ${f(y - off)}`;
  const hc = 0.62;                                           // handle length at the crossing (× ry)
  const ca = Math.cos(a), sa = Math.sin(a);
  let d = `M ${P(0, -2*T.ry)}`;
  // top lobe: top → left → center (leaving down-right)
  d += ` C ${P(-K*T.rx, -2*T.ry)} ${P(-T.rx, -T.ry - K*T.ry)} ${P(-T.rx, -T.ry)}`;
  d += ` C ${P(-T.rx, -T.ry + K*T.ry)} ${P(-hc*T.ry*ca, -hc*T.ry*sa)} ${P(0, 0)}`;
  // bottom lobe: center → right → bottom → left → center (leaving up-right)
  d += ` C ${P(hc*B.ry*ca, hc*B.ry*sa)} ${P(B.rx, B.ry - K*B.ry)} ${P(B.rx, B.ry)}`;
  d += ` C ${P(B.rx, B.ry + K*B.ry)} ${P(K*B.rx, 2*B.ry)} ${P(0, 2*B.ry)}`;
  d += ` C ${P(-K*B.rx, 2*B.ry)} ${P(-B.rx, B.ry + K*B.ry)} ${P(-B.rx, B.ry)}`;
  d += ` C ${P(-B.rx, B.ry - K*B.ry)} ${P(-hc*B.ry*ca, hc*B.ry*sa)} ${P(0, 0)}`;
  // top lobe again: center → right → top
  d += ` C ${P(hc*T.ry*ca, -hc*T.ry*sa)} ${P(T.rx, -T.ry + K*T.ry)} ${P(T.rx, -T.ry)}`;
  d += ` C ${P(T.rx, -T.ry - K*T.ry)} ${P(K*T.rx, -2*T.ry)} ${P(0, -2*T.ry)}`;
  return d;
}
const SEGS = [];   // k = 0..7 → promise k+1
function buildEight(){
  const g = $('#eight'), seg = 12.5, L = seg - E.gap;
  const probe = el('path', { d: eightPath(E.width, E.H, E.topK) }, g), len = probe.getTotalLength();
  for (let k = 0; k < 8; k++){
    const start = E.phase + k*seg + E.gap/2;   // phase keeps both crossings inside segments, away from the gaps
    const sg = el('g', { class: 'seg' }, g);
    const common = { pathLength: 100, fill: 'none', 'stroke-width': E.stroke, 'stroke-linecap': 'butt', 'stroke-dashoffset': -start };
    const o  = el('path', { ...common, stroke: E.outline, 'stroke-dasharray': `${L} ${100 - L}`, class: 'ol' }, sg);
    const ri = el('path', { ...common, stroke: CONFIG.colors.red, 'stroke-dasharray': `0 100`, class: 'ri' }, sg);
    const rf = el('path', { ...common, stroke: CONFIG.colors.red, 'stroke-dasharray': `0 100`, class: 'rf' }, sg);
    const m = probe.getPointAtLength(len * (start + L/2) / 100), mm = Math.hypot(m.x, m.y) || 1;
    SEGS.push({ k, g: sg, paths: [o, ri, rf], o, ri, rf, L, dir: mm < 20 ? [0, -1] : [m.x/mm, m.y/mm] });
  }
  probe.remove();
  let last = '';
  DERIVED.push(() => {
    const key = eightP.w.toFixed(2) + '|' + eightP.k.toFixed(3) + '|' + eightP.sw.toFixed(2);
    if (key !== last){
      last = key;
      const d = eightPath(eightP.w, E.H, eightP.k);
      SEGS.forEach(s => s.paths.forEach(p => { p.setAttribute('d', d); p.setAttribute('stroke-width', eightP.sw.toFixed(2)); }));
    }
    $('#eight').setAttribute('transform', `translate(${eightP.x.toFixed(2)} ${eightP.y.toFixed(2)}) rotate(${eightP.rot.toFixed(3)}) scale(${(eightP.s*eightP.pulse).toFixed(4)})`);
    SEGS.forEach(s => s.g.setAttribute('transform', `translate(${(s.dir[0]*eightP.ex).toFixed(2)} ${(s.dir[1]*eightP.ex).toFixed(2)})`));
  });
}

/* Faint parallax depth layer: a giant 8 in lifted black. */
function buildDepth(){
  const inner = el('g', { transform: 'translate(560 1000) scale(5.2)' }, $('#depth'));
  el('path', { d: eightPath(E.width, E.H, E.topK), fill: 'none', stroke: CONFIG.colors.lift, 'stroke-width': 30 }, inner);
}

/* =====================================================================
   Custom line-art (440×400 boxes, centered at 0,0)
   ===================================================================== */
function gearPath(n, rO, rI){
  let d = '', step = 360/n;
  for (let i = 0; i < n; i++){
    const a = i*step - 90;
    const b1 = P(rI, a-10), t1 = P(rO, a-6), t2 = P(rO, a+6), b2 = P(rI, a+10), nb = P(rI, a+step-10);
    d += (i ? ' L ' : 'M ') + b1.join(' ') + ` L ${t1.join(' ')} A ${rO} ${rO} 0 0 1 ${t2.join(' ')} L ${b2.join(' ')} A ${rI} ${rI} 0 0 1 ${nb.join(' ')}`;
  }
  return d + ' Z';
}
function arc(r, a0, a1){ const p0 = P(r, a0), p1 = P(r, a1); return `M ${p0.join(' ')} A ${r} ${r} 0 ${a1-a0>180?1:0} 1 ${p1.join(' ')}`; }
const SHIELD = 'M 0 -150 C 48 -122 92 -116 122 -116 V -12 C 122 68 64 118 0 150 C -64 118 -122 68 -122 -12 V -116 C -92 -116 -48 -122 0 -150 Z';

const ART = {
  dial: {
    svg(){
      let s = `<circle class="ln d b" r="150"/><circle class="ln a d" r="104"/>`;
      for (let i = 0; i < 24; i++){
        const major = i % 6 === 0, a = i*15 - 90, p1 = P(major ? 116 : 127, a), p2 = P(140, a);
        s += `<line class="ln d tk ${major ? 'b' : ''}" x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}"/>`;
      }
      s += `<g transform="translate(0 -58)"><circle class="ln d" r="11"/>`;
      for (let i = 0; i < 8; i++){ const a = i*45, p1 = P(17, a), p2 = P(23, a); s += `<line class="ln d" x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}"/>`; }
      s += `</g><path class="ln d" d="M 6 46 A 16 16 0 1 0 6 78 A 12 12 0 1 1 6 46 Z"/>`;
      s += `<g class="hand"><line class="ln d h" x1="0" y1="14" x2="0" y2="-112"/></g><circle class="ln d b" r="7"/>`;
      return s;
    },
    anim(tl, r, s){
      drawIn(tl, $$('.d', r), s, { dur: 0.9, stagger: 0.028 });
      tl.fromTo($('.hand', r), { rotation: 0 }, { rotation: 360, svgOrigin: '0 0', duration: 4.9, ease: 'sine.inOut', immediateRender: true }, s + 0.5);
    }
  },
  route: {
    svg(){
      const R = 'M 190 160 C 110 160 120 40 40 50 S -30 108 -72 62';
      return `<line class="ln a d" x1="-60" y1="70" x2="-214" y2="70"/>
        <path class="ln d b" d="M -84 70 V -6 L -140 -58 L -196 -6 V 70"/>
        <path class="ln d" d="M -128 70 V 28 H -152 V 70"/>
        <path class="ln a rd" d="${R}" style="stroke-dasharray:4 12"/>
        <path class="ln b solid" d="${R}" pathLength="1" style="stroke-dasharray:1 2;stroke-dashoffset:1"/>
        <g class="pin"><circle r="20" class="ln a"/><circle r="8.5" fill="#FFFFFF"/></g>
        <g transform="translate(140 -112)"><circle class="ln a d" r="34"/>
          <path class="ln d b tm" d="${arc(34, -90, 269)}"/>
          <line class="ln d" x1="0" y1="0" x2="0" y2="-18"/><line class="ln d" x1="0" y1="0" x2="12" y2="6"/></g>`;
    },
    anim(tl, r, s){
      drawIn(tl, $$('.d', r).filter(n => !n.classList.contains('tm')), s, { dur: 0.9, stagger: 0.08 });

/* =====================================================================
   Build scene
   ===================================================================== */
const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });
window.tl = tl;
const counters = [];

function buildIntro(){
  const T = CONFIG.t, I = CONFIG.intro, txt = $('#texts');
  // the 8 draws itself as one continuous red stroke
  const ri = SEGS.map(s => s.ri);
  tl.fromTo(ri, { attr: { 'stroke-dasharray': '0 100' } },
    { attr: { 'stroke-dasharray': `${SEGS[0].L} ${100 - SEGS[0].L}` }, duration: T.drawDur/8 + 0.02, stagger: T.drawDur/8, ease: 'none', immediateRender: true }, T.draw);
  tl.fromTo(eightP, { s: E.intro.s * 1.12 }, { s: E.intro.s, duration: 1.4, ease: 'expo.out', immediateRender: true }, T.draw);
  tl.fromTo($$('#eight .ol'), { opacity: 0 }, { opacity: 1, duration: 0.4, immediateRender: true }, T.fly + 0.2);
  // on-beat breathing of the big 8 (bars 1 and 2)
  [2.0, 4.0].forEach(b => {
    tl.fromTo(eightP, { pulse: 1 }, { pulse: 1.04, duration: 0.08, ease: 'power2.out', immediateRender: false }, b);
    tl.fromTo(eightP, { pulse: 1.04 }, { pulse: 1, duration: 0.4, ease: 'power2.out', immediateRender: false }, b + 0.08);
  });

  const q1 = makeText(txt, I.q1, { y: I.y.q1, cls: 'q1' });
  const q2 = makeText(txt, I.q2, { y: I.y.q2, cls: 'q2' });
  wordsIn(tl, q1.words, T.q1); wordsIn(tl, q2.words, T.q2, { stagger: 0.08 });
  wordsOut(tl, q1.words, T.qOut); wordsOut(tl, q2.words, T.qOut + 0.05);

  const ti = makeText(txt, I.title, { y: I.y.title, cls: 'q2' });
  const va = makeText(txt, I.values.join(' · '), { y: I.y.values, cls: 'values' });
  va.words.forEach(w => { if (w.textContent === '·'){ w.textContent = ''; w.className = 'w sepw'; const d = document.createElement('i'); d.className = 'sep'; w.appendChild(d); } });
  wordsIn(tl, ti.words, T.title, { stagger: 0.08 }); wordsIn(tl, va.words, T.values, { stagger: 0.1 });
  wordsOut(tl, ti.words, T.introOut); wordsOut(tl, va.words, T.introOut + 0.04);

  // the 8 rises to become the progress indicator; the red drains to an outline
  tl.fromTo(eightP, { x: E.intro.x, y: E.intro.y, s: E.intro.s }, { x: E.progress.x, y: E.progress.y, s: E.progress.s, duration: T.flyDur, ease: 'power3.inOut', immediateRender: false }, T.fly);
  tl.fromTo(ri, { opacity: 1 }, { opacity: 0, duration: 0.4, stagger: { each: 0.025, from: 'end' }, ease: 'power1.in', immediateRender: false }, T.fly + 0.05);
}

function buildPromise(cfg, i){
  const T = CONFIG.t, PT = CONFIG.p, Ly = CONFIG.layout, s0 = T.promiseStart + i*T.promiseDur;
  const host = div('layer', $('#promises'));

  // ordinal label with hairlines
  const ord = makeText(host, cfg.ord, { y: Ly.ordY, cls: 'ord', h: 80 });
  const r1 = document.createElement('i'), r2 = document.createElement('i'); r1.className = r2.className = 'rule';
  ord.line.prepend(r1); ord.line.append(r2);
  wordsIn(tl, ord.words, s0 + PT.ord, { dur: 0.45 });
  tl.fromTo([r1, r2], { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.5, ease: 'power3.out', immediateRender: true }, s0 + PT.ord + 0.1);

  // line-art hero, animated in its own sub-timeline played faster
  const art = document.createElementNS(SVGNS, 'svg');
  art.setAttribute('class', 'art'); art.setAttribute('viewBox', '-220 -200 440 400');
  Object.assign(art.style, { left: (Ly.cx - 220) + 'px', top: (Ly.artY - 200) + 'px', width: '440px', height: '400px' });
  art.innerHTML = ART[cfg.art].svg(); host.appendChild(art); prepDraw(art);
  tl.fromTo(art, { opacity: 1, x: 0, filter: 'blur(0px)' }, { opacity: 1, duration: 0.01, immediateRender: true }, s0);
  const sub = gsap.timeline({ paused: false });
  ART[cfg.art].anim(sub, art, 0);
  sub.timeScale(CONFIG.motion.art);
  tl.add(sub, s0 + PT.art);

  // red hero: counter or word
  const hero = div('hero', host, { top: (Ly.heroY - 150) + 'px', height: '300px' });
  const num = document.createElement('span'); num.className = 'num'; hero.appendChild(num);
  let unit = null;
  if (cfg.hero.unit){ unit = document.createElement('span'); unit.className = 'unit'; unit.textContent = cfg.hero.unit; hero.appendChild(unit); }
  if (cfg.hero.word){
    num.textContent = cfg.hero.word;
    tl.fromTo(num, { clipPath: HIDE_R, x: 50, filter: 'blur(12px)', opacity: 0 },
      { clipPath: SHOW, x: 0, filter: 'blur(0px)', opacity: 1, duration: 0.6, ease: 'expo.out', immediateRender: true }, s0 + PT.hero);
  } else {
    const pr = { v: 0 }, sfx = cfg.hero.suffix || '';
    num.textContent = fa(cfg.hero.count) + sfx;              // for width fitting
    counters.push({ el: num, p: pr, sfx });
    tl.fromTo(pr, { v: 0 }, { v: cfg.hero.count, duration: PT.count, ease: 'power2.out', immediateRender: true }, s0 + PT.hero);
    tl.fromTo(num, { y: 50, filter: 'blur(12px)', opacity: 0 }, { y: 0, filter: 'blur(0px)', opacity: 1, duration: 0.5, ease: 'expo.out', immediateRender: true }, s0 + PT.hero);
  }
  if (unit) tl.fromTo(unit, { clipPath: HIDE_R, x: 20, opacity: 0 }, { clipPath: SHOW, x: 0, opacity: 1, duration: 0.45, immediateRender: true }, s0 + PT.hero + 0.25);

  // the matching red segment of the 8 fills, landing on the beat, with a pulse
  const sg = SEGS[i], hit = s0 + PT.fill + PT.fillDur;
  tl.fromTo(sg.rf, { attr: { 'stroke-dasharray': '0 100' } }, { attr: { 'stroke-dasharray': `${sg.L} ${100 - sg.L}` }, duration: PT.fillDur, ease: 'power2.in', immediateRender: true }, s0 + PT.fill);
  tl.fromTo(eightP, { pulse: 1 }, { pulse: 1.14, duration: 0.1, ease: 'power2.out', immediateRender: false }, hit);
  tl.fromTo(eightP, { pulse: 1.14 }, { pulse: 1, duration: 0.45, ease: 'power2.out', immediateRender: false }, hit + 0.1);

  // title + detail
  const title = makeText(host, cfg.title, { y: Ly.titleY, cls: 'title', h: 110 });
  const detail = makeText(host, cfg.detail, { y: Ly.detailY, cls: 'detail', h: 120, wrap: true });
  wordsIn(tl, title.words, s0 + PT.title, { stagger: 0.06 });
  wordsIn(tl, detail.words, s0 + PT.detail, { stagger: 0.045, dur: 0.5 });

  // exit (toward the left)
  const o = s0 + PT.out;
  wordsOut(tl, ord.words, o);
  tl.fromTo([r1, r2], { scaleX: 1, opacity: 1 }, { scaleX: 0, opacity: 0, duration: 0.3, ease: 'power2.in', immediateRender: false }, o);
  tl.fromTo(art, { opacity: 1, x: 0, filter: 'blur(0px)' }, { opacity: 0, x: -60, filter: 'blur(8px)', duration: 0.38, ease: 'power2.in', immediateRender: false }, o + 0.02);
  const heroOut = unit ? [num, unit] : [num];
  tl.fromTo(heroOut, { clipPath: SHOW, x: 0, opacity: 1, filter: 'blur(0px)' }, { clipPath: HIDE_L, x: -40, opacity: 0, filter: 'blur(8px)', duration: 0.38, ease: 'power2.in', immediateRender: false }, o + 0.04);
  wordsOut(tl, title.words, o + 0.06);
  wordsOut(tl, detail.words, o + 0.08, { stagger: 0.02 });
  return { hero: num };
}

function fitTexts(){
  const W = CONFIG.layout.textW - 10;
  $$('.txt:not(.wrap) .line').forEach(l => {
    const w = l.getBoundingClientRect().width, fs = parseFloat(getComputedStyle(l).fontSize);
    if (w > W) l.style.fontSize = (fs * W / w).toFixed(1) + 'px';
  });
}
function fitHeroes(){
  $$('.hero .num').forEach(n => {
    const max = CONFIG.layout.heroMaxW - (n.nextSibling ? n.nextSibling.getBoundingClientRect().width + 26 : 0);
    const w = n.getBoundingClientRect().width;
    if (w > max) n.style.fontSize = Math.floor(260 * max / w) + 'px';
    // keep the red number itself on the center axis; the unit hangs to its left
    if (n.nextSibling){
      const shift = (n.nextSibling.getBoundingClientRect().width + 26) / 2;
      n.parentNode.style.left = (CONFIG.layout.cx - CONFIG.layout.textW/2 - shift).toFixed(1) + 'px';
    }
  });
}

function buildFinale(){
  const F = CONFIG.t.finale, FT = CONFIG.finale.t, svg = $('#finaleSvg'), txt = $('#texts'), Fin = E.final;
  // the appliances, sheltered under the ∞
  svg.innerHTML = `
    <g id="home" transform="translate(45 -120)">
      <path class="ln a d" d="M 850 1132 H 130"/>
      <g class="item"><rect class="ln d" x="606" y="868" width="118" height="264" rx="8"/><path class="ln d" d="M 606 958 H 724"/>
        <path class="ln d b" d="M 622 884 V 938 M 622 974 V 1040"/></g>
      <g class="item"><rect class="ln d" x="434" y="990" width="140" height="142" rx="8"/><path class="ln a d" d="M 434 1018 H 574"/>
        <circle class="ln d" cx="504" cy="1076" r="38"/><circle class="ln a d" cx="504" cy="1076" r="25"/><circle class="ln d" cx="550" cy="1004" r="5"/></g>
      <g class="item"><rect class="ln d" x="262" y="936" width="150" height="96" rx="6"/><path class="ln d" d="M 318 1032 L 308 1066 M 356 1032 L 366 1066"/>
        <rect class="ln d" x="270" y="1066" width="134" height="66" rx="4"/><path class="ln a d" d="M 337 1066 V 1132"/></g>
    </g>`;
  prepDraw(svg);
  const f = F, lock = f + FT.fly + FT.flyDur, land = f + FT.rot + FT.rotDur;
  // segments fly apart, then gather on the beat as the 8 moves to center…
  tl.fromTo(eightP, { ex: 0 }, { ex: E.explode, duration: 0.4, ease: 'power2.out', immediateRender: false }, f + FT.explode);
  tl.fromTo(eightP, { ex: E.explode }, { ex: 0, duration: 0.5, ease: 'power3.in', immediateRender: false }, lock - 0.5);
  tl.fromTo(eightP, { x: E.progress.x, y: E.progress.y, s: E.progress.s },
    { x: Fin.x, y: Fin.y, s: Fin.s, duration: FT.flyDur, ease: 'power3.inOut', immediateRender: false }, f + FT.fly);
  // …then turns 90° and becomes ∞ (lands on the next downbeat)
  tl.fromTo(eightP, { rot: 0, k: E.topK, w: E.width, sw: E.stroke }, { rot: Fin.rot, k: Fin.k, w: Fin.width, sw: Fin.stroke, duration: FT.rotDur, ease: 'power3.inOut', immediateRender: false }, f + FT.rot);
  [[lock, 1.06], [land, 1.05]].forEach(([at, amt]) => {
    tl.fromTo(eightP, { pulse: 1 }, { pulse: amt, duration: 0.1, ease: 'power2.out', immediateRender: false }, at);
    tl.fromTo(eightP, { pulse: amt }, { pulse: 1, duration: 0.5, ease: 'power2.out', immediateRender: false }, at + 0.1);
  });

  const home = $('#home', svg);
  drawIn(tl, $$(':scope > .d', home), f + FT.items, { dur: 0.7, ease: 'power2.out' });
  $$('.item', home).forEach((g, k) => drawIn(tl, $$('.d', g), f + FT.items + 0.05 + k*0.15, { dur: 0.6, stagger: 0.05, ease: 'power2.out' }));

  const ti = makeText(txt, CONFIG.finale.title, { y: CONFIG.finale.y.title, cls: 'title', h: 110 });
  const va = makeText(txt, CONFIG.finale.values.join(' · '), { y: CONFIG.finale.y.values, cls: 'values', h: 90 });
  va.words.forEach(w => { if (w.textContent === '·'){ w.textContent = ''; w.className = 'w sepw'; const d = document.createElement('i'); d.className = 'sep'; w.appendChild(d); } });
  const gr = makeText(txt, CONFIG.finale.group, { y: CONFIG.finale.y.group, cls: 'sub', h: 60 });
  wordsIn(tl, ti.words, f + FT.title, { stagger: 0.1, dur: 0.6 });
  wordsIn(tl, va.words, f + FT.values, { stagger: 0.12, dur: 0.55 });
  tl.fromTo('#logo', { opacity: 0, y: 18, filter: 'blur(8px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.8, ease: 'expo.out', immediateRender: true }, f + FT.logo);
  wordsIn(tl, gr.words, f + FT.logo + 0.25, { dur: 0.6 });

  // slow push-in on the final composition
  tl.fromTo(['#finaleSvg', '#eightSvg'], { scale: 1, transformOrigin: '540px 800px' }, { scale: 1.03, duration: CONFIG.duration - land, ease: 'sine.inOut', immediateRender: false }, land);
  tl.fromTo('#depthSvg', { opacity: 0.55 }, { opacity: 0.25, duration: 1.5, ease: 'none', immediateRender: false }, f);
}

function buildAtmosphere(){
  // parallax: depth layer drifts slowly against the right→left motion of the content
  tl.fromTo('#depthSvg', { x: 60, y: 30 }, { x: -60, y: -30, duration: CONFIG.duration, ease: 'none', immediateRender: true }, 0);
  tl.fromTo('#bgLift', { x: 20 }, { x: -20, duration: CONFIG.duration, ease: 'none', immediateRender: true }, 0);
  // seeded grain, stepped by timeline time
  const n = CONFIG.grain.tile, c = document.createElement('canvas'); c.width = c.height = n;
  const ctx = c.getContext('2d'), img = ctx.createImageData(n, n), rnd = mulberry32(CONFIG.seed);
  for (let i = 0; i < n*n; i++){ const v = 128 + (rnd() - 0.5) * 200; img.data[i*4] = img.data[i*4+1] = img.data[i*4+2] = v; img.data[i*4+3] = 255; }
  ctx.putImageData(img, 0, 0);
  const grain = $('#grain'); grain.style.backgroundImage = `url(${c.toDataURL()})`;
  const offs = [], r2 = mulberry32(CONFIG.seed + 1);
  for (let i = 0; i < 2048; i++) offs.push([Math.floor(r2()*512), Math.floor(r2()*512)]);
  let lastG = -1;
  DERIVED.push(() => {
    const gi = Math.floor(tl.time() * CONFIG.grain.fps + 1e-6) % offs.length;
    if (gi !== lastG){ lastG = gi; grain.style.backgroundPosition = `${offs[gi][0]}px ${offs[gi][1]}px`; }
  });
  DERIVED.push(() => counters.forEach(c => { const t = fa(Math.round(c.p.v)) + c.sfx; if (c.el.textContent !== t) c.el.textContent = t; }));
}

/* =====================================================================

const params = new URLSearchParams(location.search);
const RENDER = params.has('render');

function seekTo(t){ tl.seek(Math.max(0, Math.min(CONFIG.duration, t)), true); renderDerived(); }
window.seekTo = seekTo;
window.renderAt = t => { seekTo(t); return tl.time(); };

/* Sound-design cue sheet, derived from CONFIG so audio stays frame-synced with the picture. */
window.audioCues = () => {
  const T = CONFIG.t, PT = CONFIG.p, F = T.finale, FT = CONFIG.finale.t;
  return {
    duration: CONFIG.duration, seed: CONFIG.seed, bpm: CONFIG.bpm,
    hook: T.draw, question: T.q2, title: T.title, fly: T.fly, promiseStart: T.promiseStart, promiseDur: T.promiseDur,
    promises: CONFIG.promises.map((p, i) => {
      const s0 = T.promiseStart + i*T.promiseDur;
      return { start: s0, counter: !p.hero.word, heroIn: s0 + PT.hero, countDur: PT.count,
               fill: s0 + PT.fill + PT.fillDur, exit: s0 + PT.out };
    }),
    finale: { start: F, lock: F + FT.fly + FT.flyDur, inf: F + FT.rot + FT.rotDur, title: F + FT.title, logo: F + FT.logo }
  };
};

function fitStage(){
  const st = $('#stage');
  if (RENDER){ st.style.transform = 'none'; return; }
  const k = Math.min(innerWidth / 1080, (innerHeight - 70) / 1920);
  st.style.transform = `scale(${k})`;
}

async function boot(){
  try { await Promise.all(['300', '500', '800'].map(w => document.fonts.load(`${w} 72px Vazirmatn`, 'پیمان ۸ DAEWOO'))); } catch(e){}
  await document.fonts.ready;
  const r = document.documentElement.style;
  for (const k in CONFIG.colors) r.setProperty('--' + k, CONFIG.colors[k]);

  buildDepth(); buildEight(); buildAtmosphere(); buildIntro();
  CONFIG.promises.forEach(buildPromise);
  buildFinale();
  tl.set({}, {}, CONFIG.duration);   // pin total length
  fitHeroes(); fitTexts();

  fitStage(); addEventListener('resize', fitStage);
  if (RENDER) document.body.classList.add('hideui');
  seekTo(parseFloat(params.get('t')) || 0);

  // preview controls
  const play = $('#play'), scrub = $('#scrub'), clock = $('#clock');
  scrub.max = CONFIG.duration;
  const sync = () => { const t = tl.time(); scrub.value = t; clock.textContent = `${t.toFixed(2)}s · f${Math.round(t*CONFIG.fps)}`; play.textContent = tl.paused() ? '▶' : '❚❚'; };
  gsap.ticker.add(() => { if (!tl.paused()){ renderDerived(); if (tl.time() >= CONFIG.duration) tl.pause(); } sync(); });
  play.onclick = () => { if (tl.time() >= CONFIG.duration) seekTo(0); tl.paused(!tl.paused()); };
  scrub.oninput = () => { tl.pause(); seekTo(+scrub.value); };
  addEventListener('keydown', e => {
    if (e.code === 'Space'){ e.preventDefault(); play.onclick(); }
    else if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('hideui');
    else if (e.key === 's' || e.key === 'S') document.body.classList.toggle('showsafe');
    else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft'){ tl.pause(); seekTo(tl.time() + (e.key === 'ArrowRight' ? 1 : -1) / CONFIG.fps); }
  });
  window.__ready = true;
}
boot();
</script>
</body>
</html>
